name: Daily Snapshot 1AM

on:
  schedule:
    - cron: "0 18 * * *" # 01:00 Asia/Ho_Chi_Minh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run snapshot job
        env:
          SHEET_SOURCE_URL: ${{ secrets.SHEET_SOURCE_URL }}
        run: npm run snapshot-daily

      - name: Commit snapshot changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/word-snapshot.json
          git diff --cached --quiet || git commit -m "chore: update 1am snapshot"
          git push
